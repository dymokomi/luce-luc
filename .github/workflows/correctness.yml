name: Correctness
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gate:
    name: Gate (${{ matrix.host }})
    runs-on: ${{ matrix.runner }}
    # Three architectures each run six compiler modes plus a generated-C
    # sanitizer matrix with native ML-DSA/Argon2 tests. Hosted macOS ARM64 is
    # materially slower than either Linux runner for this matrix; keep the
    # complete assertions and give each architecture its measured allowance.
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, host: arm64-macos, timeout: 120 }
          - { runner: ubuntu-24.04, host: x86_64-linux, timeout: 75 }
          - { runner: ubuntu-24.04-arm, host: arm64-linux, timeout: 75 }
    defaults:
      run:
        shell: bash
        working-directory: luce-luc
    env:
      CC: clang
    steps:
      - uses: actions/checkout@v7
        with:
          path: luce-luc
      - name: Check out pinned package dependencies
        run: |
          for dependency in PKG CRYPTO GIT HTTP_CLIENT TLS COMPRESS PRISM; do
            case "$dependency" in PKG) repo=luce-pkg ;; CRYPTO) repo=luce-crypto ;; GIT) repo=luce-git ;; HTTP_CLIENT) repo=luce-http-client ;; TLS) repo=luce-tls ;; COMPRESS) repo=luce-compress ;; PRISM) repo=luce-prism ;; esac
            revision=$(cat "bootstrap/$dependency")
            [[ "$revision" =~ ^[0-9a-f]{40}$ ]] || exit 1
            git init "../$repo"
            git -C "../$repo" remote add origin "https://github.com/dymokomi/$repo.git"
            git -C "../$repo" fetch --depth 1 origin "$revision"
            git -C "../$repo" checkout --detach FETCH_HEAD
            test "$(git -C "../$repo" rev-parse HEAD)" = "$revision"
          done
      - name: Build the pinned Base compiler
        run: |
          revision=$(cat bootstrap/BASE)
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]] || { echo "Base revision must be a full commit SHA"; exit 1; }
          git init ../luce-base
          git -C ../luce-base remote add origin https://github.com/dymokomi/luce-base.git
          git -C ../luce-base fetch --depth 1 origin "$revision"
          git -C ../luce-base checkout --detach FETCH_HEAD
          test "$(git -C ../luce-base rev-parse HEAD)" = "$revision"
          (cd ../luce-base && ./build.sh)
      - name: Build the pinned Luce compiler
        run: |
          revision=$(cat bootstrap/LUCE)
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]] || { echo "Luce revision must be a full commit SHA"; exit 1; }
          git init ../luce
          git -C ../luce remote add origin https://github.com/dymokomi/luce.git
          git -C ../luce fetch --depth 1 origin "$revision"
          git -C ../luce checkout --detach FETCH_HEAD
          test "$(git -C ../luce rev-parse HEAD)" = "$revision"
          (cd ../luce && LUCE_BASE_COMPILER="$PWD/../luce-base/build/luce-base" ./build.sh)
      - name: Select Clang for generated C
        run: |
          mkdir -p "$RUNNER_TEMP/luce-bin"
          ln -s "$(command -v clang)" "$RUNNER_TEMP/luce-bin/cc"
          echo "$RUNNER_TEMP/luce-bin" >> "$GITHUB_PATH"
      - name: Run the gate
        run: LUCE_BASE_COMPILER="$PWD/../luce-base/build/luce-base" ./test.sh
      - name: Heap-tool process lifecycle regression
        run: python3 tests/test_heap_process.py
      - name: Release verification modes and sanitizers
        run: python3 tests/release_modes.py --base ../luce-base/build/luce-base
